[pytest]
# The render tests write full-size videos into tmp_path (on C:). Keep a test's temp folder only when it failed (for debugging),
# and only for the last 2 runs: passed tests' folders are removed at once, so test runs do not fill the disk.
tmp_path_retention_policy = failed
tmp_path_retention_count = 2
markers =
    real_remotion_still: the test checks the real preview still function (conftest fakes it for every other test)
    slow: a test module that takes 45 s or more on its own (Remotion renders, tsc, whole pipelines); listed in conftest.SLOW_MODULES
    live_ui: drives the running app in a browser (needs the API on :8000 and the frontend on :5173); listed in conftest.LIVE_UI_MODULES
# Fast suite (a few minutes): pytest tests -m "not slow and not live_ui". The full suite (all markers) still runs everything.
